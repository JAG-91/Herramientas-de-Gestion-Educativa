<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia Escolar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Asistencia Escolar</h1>
        </header>

        <main>
            <div class="menu-principal">
                <button id="btn-registro-diario" class="btn-primary">
                    <span class="icon">📝</span>
                    Registro diario de asistencia
                </button>
                <button id="btn-planilla-inasistencias" class="btn-secondary">
                    <span class="icon">📊</span>
                    Planilla de inasistencias
                </button>
            </div>

            <section id="contexto-section" class="card">
                <h2>Gestión de Contextos</h2>
                
                <div class="form-group">
                    <label for="selector-contextos">Seleccionar Contexto:</label>
                    <select id="selector-contextos">
                        <option value="">-- Seleccionar --</option>
                    </select>
                    <button id="btn-cargar-contexto" class="btn-small">Cargar</button>
                    <button id="btn-eliminar-contexto" class="btn-small btn-danger">Eliminar</button>
                </div>

                <div id="info-contexto" class="info-box" style="display: none;">
                    <h3>Contexto Actual</h3>
                    <p><strong>Institución:</strong> <span id="info-institucion"></span></p>
                    <p><strong>Materia:</strong> <span id="info-materia"></span></p>
                    <p><strong>Docente:</strong> <span id="info-docente"></span></p>
                    <p><strong>Ciclo Lectivo:</strong> <span id="info-ciclo"></span></p>
                    <p><strong>Total Clases:</strong> <span id="info-total-clases"></span></p>
                </div>
            </section>

            <section id="formulario-contexto" class="card">
                <h2>Crear/Editar Contexto</h2>
                <form id="form-contexto">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="institucion">Institución:</label>
                            <input type="text" id="institucion" required>
                        </div>
                        <div class="form-group">
                            <label for="logo-url">URL del Logo:</label>
                            <input type="url" id="logo-url" placeholder="https://ejemplo.com/logo.png">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="director">Director:</label>
                            <input type="text" id="director" required>
                        </div>
                        <div class="form-group">
                            <label for="ciclo-lectivo">Ciclo Lectivo:</label>
                            <input type="text" id="ciclo-lectivo" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="materia">Materia:</label>
                            <input type="text" id="materia" required>
                        </div>
                        <div class="form-group">
                            <label for="docente">Docente:</label>
                            <input type="text" id="docente" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="total-clases">Total de Clases:</label>
                        <input type="number" id="total-clases" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="lista-alumnos">Lista de Alumnos (uno por línea - Formato: Número, Nombre, Apellido):</label>
                        <textarea id="lista-alumnos" rows="10" placeholder="1, Juan, Pérez&#10;2, María, González&#10;3, Carlos, Rodríguez" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Guardar Contexto</button>
                        <button type="reset" class="btn-secondary">Limpiar</button>
                    </div>
                </form>
            </section>
        </main>

        <!-- Modal de Observaciones -->
        <div id="modal-observaciones" class="modal" style="display: none;">
            <div class="modal-content">
                <h3>Agregar Observaciones</h3>
                <textarea id="texto-observaciones" rows="5" placeholder="Ingrese las observaciones que aparecerán en la impresión..."></textarea>
                <div class="modal-actions">
                    <button id="btn-cancelar-observaciones" class="btn-secondary">Cancelar</button>
                    <button id="btn-imprimir-con-observaciones" class="btn-primary">Imprimir</button>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2024 Sistema de Asistencia Escolar</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
