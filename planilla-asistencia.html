<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de porcentaje de inasistencia para alumnos.">

    <title>Planilla de Porcentaje de Asistencias</title>

    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos CSS embebidos para facilitar el uso independiente -->
    <style>
        /* ===========================
           VARIABLES
        =========================== */
        :root {
            --color-primario: #2563eb;
            --color-primario-hover: #1d4ed8;
            --verde: #22c55e;
            --amarillo: #facc15;
            --rojo: #ef4444;
            --gris: #f3f4f6;
            --gris2: #e5e7eb;
            --texto: #1f2937;
            --blanco: #ffffff;
            --radio: 14px;
            --sombra: 0 8px 24px rgba(0, 0, 0, .08);
        }

        /* ===========================
           RESET
        =========================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #eef2f7;
            color: var(--texto);
            min-height: 100vh;
        }

        /* ===========================
           HEADER
        =========================== */
        header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 35px;
            text-align: center;
            box-shadow: var(--sombra);
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        /* ===========================
           CONTENEDOR
        =========================== */
        .contenedor {
            width: min(1200px, 95%);
            margin: 30px auto;
        }

        /* ===========================
           CARDS
        =========================== */
        .card {
            background: white;
            border-radius: var(--radio);
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: var(--sombra);
        }

        /* ===========================
           INPUTS
        =========================== */
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            transition: .25s;
            font-size: 15px;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--color-primario);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
        }

        /* ===========================
           FORMULARIO
        =========================== */
        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr 170px 180px;
            gap: 15px;
            margin-top: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ===========================
           BOTONES
        =========================== */
        button {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 600;
            transition: .25s;
            background: var(--color-primario);
            color: white;
        }

        button:hover {
            background: var(--color-primario-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .peligro {
            background: var(--rojo);
        }

        .peligro:hover {
            background: #dc2626;
        }

        .btnDeshacer {
            background: #8b5cf6;
        }

        .btnDeshacer:hover:not(:disabled) {
            background: #7c3aed;
        }

        /* ===========================
           ESTADISTICAS
        =========================== */
        .estadisticas {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border-radius: var(--radio);
            padding: 22px;
            text-align: center;
            box-shadow: var(--sombra);
        }

        .tituloStat {
            display: block;
            color: #6b7280;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat span:last-child {
            font-size: 1.6rem;
            font-weight: 700;
        }

        /* ===========================
           TABLA
        =========================== */
        .tablaResponsive {
            overflow: auto;
        }

        .botonesTabla {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .checkboxContenedor {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .checkboxContenedor input[type="checkbox"] {
            width: auto;
            padding: 0;
            margin: 0;
            cursor: pointer;
            accent-color: var(--color-primario);
        }

        .colCheck {
            width: 50px;
            text-align: center;
        }

        table input[type="checkbox"] {
            width: auto;
            padding: 0;
            margin: 0;
            cursor: pointer;
            accent-color: var(--color-primario);
        }

        tbody tr.seleccionada {
            background: #dbeafe;
        }

        tbody tr.seleccionada:nth-child(even) {
            background: #dbeafe;
        }

        .oculto {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 5;
        }

        thead th {
            background: #2563eb;
            color: white;
            padding: 14px;
        }

        tbody td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:nth-child(even) {
            background: #fafafa;
        }

        tbody tr:hover {
            background: #edf4ff;
        }

        .ordenable {
            cursor: pointer;
            user-select: none;
        }

        .ordenable:hover {
            background: #1d4ed8;
        }

        /* ===========================
           PORCENTAJES
        =========================== */
        .porcentaje-alto {
            color: var(--verde);
            font-weight: 700;
        }

        .porcentaje-medio {
            color: #ca8a04;
            font-weight: 700;
        }

        .porcentaje-bajo {
            color: var(--rojo);
            font-weight: 700;
        }

        /* ===========================
           ACCIONES
        =========================== */
        .acciones {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 25px;
        }

        .herramientas {
            display: flex;
            gap: 18px;
            align-items: end;
            justify-content: space-between;
        }

        .selectorPlanilla,
        .accionesPlanilla {
            display: flex;
            gap: 10px;
            align-items: end;
            flex-wrap: wrap;
        }

        .selectorPlanilla label {
            width: 100%;
            font-weight: 600;
        }

        select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            font-size: 15px;
        }

        .selectorPlanilla input {
            width: 210px;
        }

        .accionesPlanilla button {
            white-space: nowrap;
        }

        /* ===========================
           MODAL
        =========================== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modalContenido {
            width: 400px;
            max-width: 95%;
            background: white;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: aparecer .25s ease;
        }

        .modalBotones {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* ===========================
           TOAST
        =========================== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111827;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: .35s;
            box-shadow: var(--sombra);
        }

        .toast.mostrar {
            opacity: 1;
        }

        /* ===========================
           BOTONES DE TABLA
        =========================== */
        .btnEditar {
            background: #10b981;
            margin-right: 6px;
        }

        .btnEditar:hover {
            background: #059669;
        }

        .btnEliminar {
            background: #ef4444;
        }

        .btnEliminar:hover {
            background: #dc2626;
        }

        /* ===========================
           ANIMACIONES
        =========================== */
        @keyframes aparecer {
            from {
                transform: translateY(25px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ===========================
           RESPONSIVE
        =========================== */
        @media (max-width: 900px) {
            .herramientas {
                align-items: stretch;
                flex-direction: column;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .estadisticas {
                grid-template-columns: 1fr 1fr;
            }

            .botonesTabla {
                flex-direction: column;
                align-items: stretch;
            }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.5rem;
            }

            .estadisticas {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 14px;
            }

            button {
                width: 100%;
            }

            .acciones {
                flex-direction: column;
            }

            .selectorPlanilla,
            .accionesPlanilla {
                align-items: stretch;
                flex-direction: column;
            }

            .selectorPlanilla input,
            .selectorPlanilla select {
                width: 100%;
            }

            .botonesTabla {
                flex-direction: column;
            }

            .checkboxContenedor {
                width: 100%;
            }
        }

        /* ===========================
           PRINT STYLES
        =========================== */
        @media print {
            body {
                background: white;
            }

            header {
                color: #111827;
                background: white;
                box-shadow: none;
                padding: 15px;
            }

            .card:not(.tablaCard),
            .estadisticas,
            .tablaCard td:last-child,
            .tablaCard th:last-child,
            .toast,
            button,
            input[type="text"],
            input[type="number"],
            input[type="search"],
            textarea,
            .modal,
            .selectorPlanilla,
            .accionesPlanilla,
            .botonesTabla,
            .formulario,
            .checkboxContenedor,
            #buscarAlumno {
                display: none !important;
            }

            .contenedor {
                width: 100%;
                margin: 0;
            }

            .tablaCard {
                box-shadow: none;
                padding: 0;
            }

            .impresion-contenedor {
                display: block;
                width: 100%;
            }

            .impresion-encabezado {
                text-align: left;
                padding: 12px 0 18px 0;
                border-bottom: 2px solid #111827;
                margin-bottom: 12px;
            }

            .impresion-encabezado img {
                max-height: 72px;
                display: inline-block;
                vertical-align: middle;
                margin-right: 12px;
            }

            .impresion-encabezado .datos {
                display: inline-block;
                vertical-align: middle;
            }

            .tablaCard table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }

            .tablaCard thead th {
                background: #2563eb !important;
                -webkit-print-color-adjust: exact;
                color: white !important;
                padding: 8px;
            }

            .tablaCard tbody td {
                padding: 8px;
                border: 1px solid #e5e7eb;
            }

            footer.print-footer {
                margin-top: 18px;
                display: block;
                text-align: left;
                font-size: 12px;
            }

            @page {
                margin: 20mm;
            }
        }
    </style>
</head>

<body>

<!-- Encabezado principal -->
<header>
    <h1>📋 Planilla de Porcentaje de Asistencias</h1>
</header>

<!-- Contenedor principal -->
<main class="contenedor">

    <!-- Sección: Clases efectivas -->
    <section class="card">
        <h2>Clases efectivas</h2>
        <div class="campo">
            <label for="totalClases">Cantidad total de clases</label>
            <input type="number" id="totalClases" min="1" placeholder="Ejemplo: 82">
        </div>
    </section>

    <!-- Sección: Gestión de planillas -->
    <section class="card herramientas">
        <div class="selectorPlanilla">
            <label for="selectorPlanilla">Planilla actual</label>
            <select id="selectorPlanilla"></select>
            <input type="text" id="nombrePlanilla" placeholder="Nombre de la nueva planilla">
            <button id="btnNuevaPlanilla">Nueva planilla</button>
        </div>

        <div class="accionesPlanilla">
            <button id="btnImprimir">Imprimir / PDF</button>
            <button id="btnEliminarPlanilla" class="peligro">Eliminar planilla</button>
        </div>
    </section>

    <!-- Sección: Estadísticas -->
    <section class="estadisticas">
        <div class="stat">
            <span class="tituloStat">Alumnos</span>
            <span id="cantidadAlumnos">0</span>
        </div>
        <div class="stat">
            <span class="tituloStat">Promedio</span>
            <span id="promedioCurso">0%</span>
        </div>
        <div class="stat">
            <span class="tituloStat">Mayor porcentaje</span>
            <span id="mayorPorcentaje">—</span>
        </div>
        <div class="stat">
            <span class="tituloStat">Menor porcentaje</span>
            <span id="menorPorcentaje">—</span>
        </div>
        <div class="stat">
            <span class="tituloStat">Última modificación</span>
            <span id="ultimaModificacion">—</span>
        </div>
    </section>

    <!-- Sección: Buscador -->
    <section class="card">
        <input type="text" id="buscarAlumno" placeholder="🔍 Buscar por nombre o apellido...">
    </section>

    <!-- Sección: Formulario para agregar alumno -->
    <section class="card">
        <h2>Agregar alumno</h2>
        <div class="formulario">
            <input type="text" id="nombre" placeholder="Nombre (opcional)">
            <input type="text" id="apellido" placeholder="Apellido (opcional)">
            <input type="number" id="inasistencias" min="0" placeholder="Inasistencias">
            <button id="btnAgregar">Agregar alumno</button>
        </div>
    </section>

    <!-- Sección: Tabla de alumnos -->
    <section class="card tablaCard">
        <div class="botonesTabla">
            <label class="checkboxContenedor">
                <input type="checkbox" id="seleccionarTodo">
                Seleccionar todos
            </label>
            <button id="btnEliminarSeleccionados" disabled>Eliminar seleccionados</button>
            <button id="btnDeshacer" class="btnDeshacer" disabled>Deshacer</button>
        </div>

        <div class="tablaResponsive">
            <table>
                <thead>
                    <tr>
                        <th class="colCheck">✓</th>
                        <th>#</th>
                        <th class="ordenable" data-columna="nombre">Nombre</th>
                        <th class="ordenable" data-columna="apellido">Apellido</th>
                        <th class="ordenable" data-columna="inasistencias">Inasistencias</th>
                        <th class="ordenable" data-columna="porcentaje">% Inasistencia</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <!-- Las filas se generan dinámicamente con JavaScript -->
                </tbody>
            </table>
        </div>
    </section>

</main>

<!-- Modal de edición de alumno -->
<div id="modalEditar" class="modal oculto">
    <div class="modalContenido">
        <h2>Editar alumno</h2>
        <input type="text" id="editarNombre" placeholder="Nombre">
        <input type="text" id="editarApellido" placeholder="Apellido">
        <input type="number" id="editarInasistencias" placeholder="Inasistencias">
        <div class="modalBotones">
            <button id="guardarEdicion">Guardar</button>
            <button id="cancelarEdicion">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal de impresión institucional -->
<div id="modalImprimir" class="modal oculto">
    <div class="modalContenido">
        <h2>Imprimir planilla (Datos institucionales)</h2>
        <input type="text" id="institucion" placeholder="Nombre de la institución">
        <label for="logoInstitucion">Logo institucional (opcional)</label>
        <input type="file" id="logoInstitucion" accept="image/*">
        <input type="text" id="cursoImprimir" placeholder="Curso">
        <input type="text" id="divisionImprimir" placeholder="División">
        <input type="text" id="cicloImprimir" placeholder="Ciclo lectivo">
        <input type="text" id="periodoImprimir" placeholder="Período (ej. 1.º trimestre)">
        <input type="text" id="docenteImprimir" placeholder="Docente">
        <input type="date" id="fechaImpresion">
        <textarea id="observacionesImprimir" placeholder="Observaciones (opcional)" style="min-height:60px"></textarea>
        <div class="modalBotones">
            <button id="confirmarImprimir">Imprimir</button>
            <button id="cancelarImprimir">Cancelar</button>
        </div>
    </div>
</div>

<!-- Notificación toast -->
<div id="toast" class="toast"></div>

<!-- Script JavaScript -->
<script src="planilla-asistencia.js"></script>

</body>
</html>
